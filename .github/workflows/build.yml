name: Build MyFin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MyFin.xcodeproj \
            -scheme MyFin \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/MyFin.app

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/MyFin.app out/Payload/
          APP=out/Payload/MyFin.app
          ls "$APP/PlugIns"
          codesign -f -s - --entitlements Support/Widget.entitlements "$APP/PlugIns/MyFinWidget.appex"
          codesign -f -s - --entitlements Support/MyFin.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -A2 application-groups
          cd out && zip -qry MyFin.ipa Payload && cd ..
          SIZE=$(stat -f%z out/MyFin.ipa)
          python3 scripts/make_source.py "$VERSION" "$BUILD" "$SIZE" "${{ github.repository }}" > out/source.json
          cat out/source.json

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyFin-${{ env.VERSION }}
          path: out/MyFin.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" out/MyFin.ipa out/source.json \
            --title "MyFin $VERSION" \
            --notes "Avtomatik build #$BUILD. SideStore manbasi: https://github.com/${{ github.repository }}/releases/latest/download/source.json" \
            --latest
