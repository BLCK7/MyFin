name: MyFin
options:
  bundleIdPrefix: uz.saminov
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MyFin:
    type: application
    platform: iOS
    sources:
      - path: MyFin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.saminov.myfin
        PRODUCT_NAME: MyFin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: MyFin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSFaceIDUsageDescription: "MyFin moliyaviy ma'lumotlaringizni himoyalash uchun Face ID'dan foydalanadi."
        ITSAppUsesNonExemptEncryption: false
schemes:
  MyFin:
    build:
      targets:
        MyFin: all
    run:
      config: Debug
    archive:
      config: Release
