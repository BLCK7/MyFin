name: MyFin
options:
  bundleIdPrefix: uz.saminov
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  MyFin:
    type: application
    platform: iOS
    sources:
      - path: MyFin
      - path: Shared
    dependencies:
      - target: MyFinWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.saminov.myfin
        PRODUCT_NAME: MyFin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: MyFin
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, uz]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: uz.saminov.myfin
            CFBundleURLSchemes: [myfin]
        NSFaceIDUsageDescription: "MyFin moliyaviy ma'lumotlaringizni himoyalash uchun Face ID'dan foydalanadi."
        NSPhotoLibraryUsageDescription: "Hujjat rasmlarini shifrlangan seyfga qo'shish uchun."
        NSCameraUsageDescription: "Hujjat yoki chekni suratga olish uchun."
        ITSAppUsesNonExemptEncryption: false
  MyFinWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MyFinWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.saminov.myfin.widget
        PRODUCT_NAME: MyFinWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: MyFin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  MyFinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MyFinTests
    dependencies:
      - target: MyFin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.saminov.myfin.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MyFin:
    build:
      targets:
        MyFin: all
        MyFinTests: [test]
    test:
      config: Debug
      targets:
        - MyFinTests
    run:
      config: Debug
    archive:
      config: Release
